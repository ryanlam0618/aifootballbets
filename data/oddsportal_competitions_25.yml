# oddsportal_competitions_25.yml
# Canonical competition list aligned to Kris' SofaScore 25-league/cup list.
#
# Goal:
# - Provide a single canonical key per competition (stable internal name)
# - Keep aliases for:
#   - SofaScore source_tournament renames (already observed in appdb)
#   - OddsPortal listing URL slugs (old/new) (to be filled programmatically)
#
# NOTE: OddsPortal alias discovery is pending because web_search is rate-limited.
# We'll fill oddsportal.url_templates + oddsportal.slug_aliases iteratively.

version: 1

